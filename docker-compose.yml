services:
  # ─── Bot Service ─────────────────────────────────────────────────────────────
  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: wardeum_bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - wardeum_data:/app/data

volumes:
  wardeum_data:
    driver: local
