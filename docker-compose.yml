services:
  # ─── Bot Service ─────────────────────────────────────────────────────────────
  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: wardeum_bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - wardeum_data:/app/data
    depends_on:
      - api
    networks:
      - wardeum_net

  # ─── API Service ─────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: wardeum_api
    restart: unless-stopped
    env_file: .env
    expose:
      - "8000"
    volumes:
      - wardeum_data:/app/data
    networks:
      - wardeum_net

  # ─── Frontend Builder (build only, not a runtime service) ───────────────────
  # Run: docker-compose run --rm frontend-builder
  frontend-builder:
    image: node:20-alpine
    working_dir: /frontend
    volumes:
      - ./frontend:/frontend
      - ./nginx/html:/output
    command: sh -c "npm install && npm run build && cp -r dist/* /output/"
    profiles:
      - build

  # ─── Nginx (reverse proxy + static files) ────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: wardeum_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
    networks:
      - wardeum_net

  # ─── Cloudflare Tunnel ───────────────────────────────────────────────────────
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: wardeum_tunnel
    restart: unless-stopped
    command: tunnel --url http://nginx:80
    depends_on:
      - nginx
    networks:
      - wardeum_net


volumes:
  wardeum_data:
    driver: local

networks:
  wardeum_net:
    driver: bridge
